# Liga/desliga canais e define o ritmo. Horários de verdade ficam nos arquivos .github/workflows/*.yml
telegram:
  ativo: true
  url: "https://t.me/achadosescondidos"   # link público do canal (aparece na vitrine) — ajuste para o seu
  ofertas_por_execucao: 1        # o workflow roda a cada 2h das 8h às 22h -> ~8 ofertas/dia
  botao: "🛒 Ver oferta"

threads:
  ativo: false
  por_execucao: 1
  intervalo_min_horas: 3.5     # ~4 posts por dia

instagram:
  ativo: false
  # AGENDA DO INSTAGRAM. Horários de Brasília (de 9 a 21) em que sai cada publicação.
  # Para subir o ritmo é só acrescentar horários nas listas (e salvar). Degraus sugeridos,
  # olhando as métricas entre um e outro:
  #   2 por dia (agora): horas_post [12, 19]        horas_reel [13, 20]
  #   3 por dia:         horas_post [9, 12, 19]     horas_reel [10, 13, 20]
  #   4 por dia:         horas_post [9, 12, 15, 19] horas_reel [10, 13, 17, 20]
  horas_post: [12, 19]
  horas_reel: [13, 20]
  reel_diario: true              # false = não publica Reels
  carrossel_dia_semana: 6        # 0=segunda ... 6=domingo: o 1º post desse dia vira o carrossel "Top 5"

whatsapp:
  # Não há API oficial para postar em Canais do WhatsApp. O Gerente manda para você,
  # no Telegram, um texto pronto para colar no canal (leva 30 segundos por dia).
  resumo_diario: true
  ofertas_no_resumo: 5

vitrine:
  ativo: true
  # Preencha com a URL do seu GitHub Pages (ou use o secret PUBLIC_BASE_URL)
  url_publica: ""
  max_ofertas: 60

# subIds que vão em cada link da Shopee: o Analista usa isso para saber qual canal vendeu
sub_ids:
  telegram: tg
  threads: th
  instagram: ig
  whatsapp: wa
  vitrine: vt
  tiktok: tt

# Botões de redes sociais na vitrine. Deixe url vazia até o perfil existir: o botão só aparece com link.
redes:
  - nome: Telegram
    url: "https://t.me/achadosescondidos"
