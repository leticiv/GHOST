# Identidade da marca — usada por todos os agentes (textos, artes e vídeos)
nome: "Achados Escondidos"
arroba: "@achadosescondidos"       # troque pelo @ que você conseguir registrar
slogan: "Achadinhos para gatos escolhidos por quem convive com eles"
promessa: "Só indico o que eu daria pro meu próprio gato."

tom_de_voz: >
  Direto, prático e confiável, com um toque de quem entende de gato.
  Frases curtas. Sem CAPS LOCK, sem "CORRE!!!", sem urgência falsa, sem prometer o que o produto não faz.
  Sempre explique POR QUE o produto é útil (dica de quem convive com gato), não só que está barato.

aviso_afiliado: "Link de parceiro: ganho uma pequena comissão, sem custo extra pra você."
aviso_preco: "Preço e disponibilidade podem mudar a qualquer momento."

cores:
  primaria: "#6C4AB6"   # roxo
  fundo: "#EEF7F4"      # menta claríssima
  texto: "#221B33"      # roxo-grafite
  destaque: "#2FB6A3"   # verde-menta
  preco_fundo: "#2A1E45"

fontes:
  titulo: "Poppins-Bold.ttf"
  medio: "Poppins-Medium.ttf"
  texto: "Poppins-Regular.ttf"

voz_video: "pt-BR-AntonioNeural"   # outras: pt-BR-FranciscaNeural, pt-BR-ThalitaMultilingualNeural

# Modelo do Reel / TikTok / Shorts:
#   "faixas"  = produto recortado em pé numa bancada (assets/fundos), texto grande com contorno, um bloco por vez
#   "classico" = modelo anterior (5 cenas fixas)
video_modelo: "faixas"
# Opcionais: video_fundo: inox_3 (força um fundo)  |  video_recorte: auto | forcar | branco | off

# Voz reserva: se a voz oficial (voz_video) falhar, o robô tenta 3 vezes. Depois disso:
#   false = NÃO gera o vídeo (a rotina tenta de novo na próxima hora)  <- padrão: a voz da marca nunca muda sozinha
#   true  = usa a voz do Google (gTTS), que é outra voz
video_voz_reserva: false
