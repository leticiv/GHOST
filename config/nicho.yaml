# O que o Caçador procura e como o Curador filtra
# Cada execução sorteia algumas palavras-chave (as do tema do calendário têm prioridade).
palavras_chave:
  - arranhador para gato
  - torre arranhador gato
  - brinquedo para gato
  - varinha com penas para gato
  - ratinho de brinquedo gato
  - laser para gato
  - bolinha interativa gato
  - fonte de água para gato
  - bebedouro automático gato
  - comedouro automático gato
  - comedouro duplo gato
  - bebedouro para gato
  - escova removedora de pelos gato
  - escova para gato
  - rasqueadeira gato
  - cama para gato
  - casinha para gato
  - ninho redondo gato
  - toca para gato
  - caixa de areia para gato
  - areia sanitária gato
  - tapete higiênico gato
  - banheiro fechado gato
  - coleira para gato
  - guia peitoral gato
  - bolsa de transporte gato
  - mochila transporte gato
  - tela de proteção para janela gato
  - catnip para gato
  - petiscos para gato

palavras_por_execucao: 3
resultados_por_palavra: 20

filtros:
  preco_min: 9.90
  preco_max: 350
  nota_min: 4.6
  vendas_min: 150
  comissao_pct_min: 3.0
  dias_sem_repetir: 10

# Palavras que eliminam o produto (qualidade, segurança ou marca)
bloqueio:
  - réplica
  - replica
  - usado
  - recondicionado
  - adulto
  - arma
  - cigarro
  - vape
  - emagrecedor
  - remédio
  - veneno
  - coleira de choque
  - anticoncepcional

# Pesos da nota do Curador (quanto maior, mais importa)
pesos:
  comissao_valor: 3.0     # R$ que você ganha por venda
  desconto: 1.5
  vendas: 1.5             # prova social (escala log)
  nota: 1.0
  tema_do_dia: 2.0        # bônus se casa com o tema do calendário
