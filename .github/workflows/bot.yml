# Backup manual do bot. O bot "sempre ligado" roda na VPS (systemd: ghost.service, comando `vigiar`).
# Não agende aqui: dois pollers no mesmo token dão conflito no getUpdates.
name: Bot (backup manual)
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ghost
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
  TELEGRAM_CHANNEL_URL: ${{ vars.TELEGRAM_CHANNEL_URL }}
  SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
  SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
  TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}

jobs:
  bot:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -q -r requirements.txt

      - name: Atender mensagens
        run: python -m ghost.run bot

      - name: Salvar estado (e marcar se a vitrine mudou)
        id: salvar
        run: |
          git config user.name "ghost-bot"
          git config user.email "ghost-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "nada para salvar"
            exit 0
          fi
          if git diff --cached --name-only | grep -q '^docs/'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
          git commit -q -m "ghost: bot $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break || sleep 5; done

      - uses: actions/configure-pages@v5
        if: steps.salvar.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.salvar.outputs.deploy == 'true'
        with:
          path: docs
      - id: deploy
        if: steps.salvar.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
