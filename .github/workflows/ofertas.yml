# A publicação automática roda na VPS (systemd timer `ghost-ofertas`, a cada 2h, ver repo ghost-bot).
# Aqui fica só como fallback manual para não termos dois escritores do estado/vitrine.
name: Ofertas (manual, backup)
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ghost
  cancel-in-progress: false

jobs:
  ofertas:
    uses: ./.github/workflows/_pipeline.yml
    with:
      comando: ofertas
    secrets: inherit
